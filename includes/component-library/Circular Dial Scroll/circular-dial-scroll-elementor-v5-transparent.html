<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circular Dial Scroll — Dynamic Background & Customization Demo</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #0a0a0c; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { overflow-x: hidden; }

    :root {
      --dial-size: min(148vw, 1500px);
      --dial-left: calc(var(--dial-size) * -0.70);
      --dial-top: 50%;
      --section_height: 100vh;
      --section_min_height: 720px;
      --content_max_width: 480px;
      --bg_overlay_color: rgba(0, 0, 0, 0.45);
      --bg_transition_duration: 0.6s;
      --dial_line_color: rgba(255, 255, 255, 0.62);
      --dial_line_width: 1px;
      --dial_dot_color: #ffffff;
      --dial_dot_glow_color: rgba(255, 255, 255, 0.75);
      --active_label_color: #ffffff;
      --inactive_label_color: rgba(255, 255, 255, 0.28);
      --eyebrow_color: rgba(255, 255, 255, 0.62);
      --title_color: #ffffff;
      --body_color: rgba(255, 255, 255, 0.7);
      --counter_color: rgba(255, 255, 255, 0.48);
    }

    .dial-demo-wrapper {
      position: relative;
      min-height: var(--section_height, 100vh);
      background: transparent;
    }

    .dial-stage {
      position: relative;
      height: var(--section_height, 100vh);
      min-height: var(--section_min_height, 720px);
      overflow: hidden;
      isolation: isolate;
      background: transparent;
    }

    /* Background Layers */
    .dial-bg-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .dial-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity var(--bg_transition_duration, 0.6s) cubic-bezier(0.22, 1, 0.36, 1),
                  transform var(--bg_transition_duration, 0.6s) cubic-bezier(0.22, 1, 0.36, 1);
      will-change: opacity, transform;
    }

    .dial-bg--fixed {
      z-index: 1;
    }

    .dial-demo-wrapper[data-bg-mode="fixed"] .dial-bg--fixed {
      opacity: 1;
      transform: scale(1);
    }

    .dial-bg-stage-layers {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .dial-bg--stage {
      z-index: 2;
    }

    .dial-demo-wrapper[data-bg-mode="dynamic"] .dial-bg--stage.is-active {
      opacity: 1;
      transform: scale(1);
      z-index: 3;
    }

    .dial-demo-wrapper[data-bg-mode="dynamic"] .dial-bg--fixed {
      opacity: 0.6;
      transform: scale(1);
    }

    .dial-demo-wrapper[data-bg-mode="none"] .dial-bg-container {
      display: none;
    }

    .dial-bg-overlay {
      position: absolute;
      inset: 0;
      background-color: var(--bg_overlay_color, rgba(0, 0, 0, 0.45));
      z-index: 4;
      pointer-events: none;
    }

    /* Dial */
    .dial {
      position: absolute;
      width: var(--dial-size);
      aspect-ratio: 1;
      left: var(--dial-left);
      top: var(--dial-top);
      transform: translateY(-50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 4;
    }

    .dial__circle {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .dial__base {
      fill: none;
      stroke: var(--dial_line_color, rgba(255, 255, 255, 0.62));
      stroke-width: var(--dial_line_width, 1);
      vector-effect: non-scaling-stroke;
    }

    .dial__dot {
      fill: var(--dial_dot_color, #ffffff);
      filter: drop-shadow(0 0 6px var(--dial_dot_glow_color, rgba(255, 255, 255, 0.75)));
    }

    .dial__label {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
      user-select: none;
      will-change: transform, opacity;
      font-size: clamp(34px, 4.4vw, 78px);
      line-height: 1;
      font-weight: 400;
      letter-spacing: -.06em;
      color: var(--inactive_label_color, rgba(255, 255, 255, 0.28));
    }

    .dial__label.is-active {
      color: var(--active_label_color, #ffffff);
    }

    /* Content */
    .dial-content {
      position: absolute;
      z-index: 5;
      left: clamp(28px, 40vw, 680px);
      top: 50%;
      width: min(var(--content_max_width, 480px), calc(100vw - 80px));
      transform: translateY(-50%);
    }

    .dial-content__eyebrow {
      margin: 0 0 18px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .2em;
      color: var(--eyebrow_color, rgba(255, 255, 255, 0.62));
    }

    .dial-content__title {
      margin: 0;
      max-width: 11ch;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: clamp(42px, 6vw, 92px);
      line-height: .95;
      font-weight: 400;
      letter-spacing: -.055em;
      color: var(--title_color, #ffffff);
    }

    .dial-content__body {
      margin: 28px 0 0;
      max-width: 39ch;
      color: var(--body_color, rgba(255, 255, 255, 0.7));
      font-size: 15px;
      line-height: 1.7;
    }

    .dial-content__counter {
      display: flex;
      gap: 8px;
      margin-top: 28px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--counter_color, rgba(255, 255, 255, 0.48));
    }

    /* Tablet */
    @media (max-width: 1024px) {
      :root {
        --dial-size: 168vw;
        --dial-left: calc(var(--dial-size) * -0.855);
      }

      .dial-stage {
        height: var(--section_height, 100svh);
        min-height: calc(var(--section_min_height, 720px) * 0.92);
      }

      .dial-content {
        left: 22vw;
        top: calc(50% + 76px);
        width: min(var(--content_max_width, 520px), 70vw);
        transform: none;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .dial-content__eyebrow {
        display: none;
      }

      .dial-content__counter {
        order: 1;
        margin: 0 0 18px;
        font-size: 10px;
        letter-spacing: .14em;
      }

      .dial-content__title {
        order: 2;
        max-width: none;
        font-family: inherit;
        font-size: clamp(20px, 3vw, 30px);
        line-height: 1.15;
        font-weight: 500;
        letter-spacing: -.025em;
      }

      .dial-content__body {
        order: 3;
        margin-top: 12px;
        max-width: 48ch;
        font-size: clamp(13px, 1.7vw, 16px);
        line-height: 1.55;
      }

      .dial__label {
        font-size: clamp(34px, 6vw, 62px);
      }
    }

    /* Mobile */
    @media (max-width: 767px) {
      :root {
        --dial-size: 190vw;
        --dial-left: calc(var(--dial-size) * -0.895);
      }

      .dial-stage {
        height: var(--section_height, 100svh);
        min-height: calc(var(--section_min_height, 720px) * 0.85);
      }

      .dial-content {
        left: 16vw;
        top: calc(50% + 64px);
        width: calc(100vw - 25vw);
      }

      .dial-content__counter {
        margin-bottom: 17px;
        font-size: 9px;
      }

      .dial-content__title {
        font-size: clamp(17px, 4.8vw, 21px);
        line-height: 1.2;
      }

      .dial-content__body {
        margin-top: 10px;
        max-width: 34ch;
        font-size: clamp(12px, 3.5vw, 15px);
        line-height: 1.5;
      }

      .dial__label {
        font-size: clamp(36px, 11vw, 50px);
      }

      .dial__base {
        stroke-width: calc(var(--dial_line_width, 1) * 0.8);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dial,
      .dial__label,
      .dial__dot,
      .dial-bg,
      .dial-content__title,
      .dial-content__body {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="dial-demo-wrapper" id="circularDialDemo" data-bg-mode="dynamic">
    <section class="dial-stage">
      <!-- Background Layers -->
      <div class="dial-bg-container">
        <div class="dial-bg dial-bg--fixed" style="background-image: url('https://images.unsplash.com/photo-1581092160607-ee22621dd758?q=80&w=1600&auto=format&fit=crop');"></div>
        <div class="dial-bg-stage-layers"></div>
        <div class="dial-bg-overlay"></div>
      </div>

      <!-- Dial Circle -->
      <div class="dial" aria-hidden="true">
        <svg class="dial__circle" viewBox="0 0 1000 1000">
          <circle class="dial__base" cx="500" cy="500" r="430"></circle>
          <circle class="dial__dot" cx="0" cy="0" r="5"></circle>
        </svg>

        <div class="dial__labels"></div>
      </div>

      <!-- Dial Content -->
      <div class="dial-content">
        <p class="dial-content__eyebrow sc-eyebrow_typography">Process</p>
        <h2 class="dial-content__title sc-title_typography">Material selection</h2>
        <p class="dial-content__body sc-body_typography">We begin by choosing materials for performance, tactility and long-term durability.</p>
        <div class="dial-content__counter sc-counter_typography">
          <span class="current">01</span><span class="separator">/</span><span class="total">05</span>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <script>
    (() => {
      const root = document.querySelector('#circularDialDemo');
      if (!root || typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;

      gsap.registerPlugin(ScrollTrigger);

      const stage = root.querySelector('.dial-stage');
      const dot = root.querySelector('.dial__dot');
      const labelsWrap = root.querySelector('.dial__labels');
      const title = root.querySelector('.dial-content__title');
      const body = root.querySelector('.dial-content__body');
      const counterCurrent = root.querySelector('.dial-content__counter .current');
      const counterTotal = root.querySelector('.dial-content__counter .total');
      const stageLayersWrap = root.querySelector('.dial-bg-stage-layers');

      const stages = [
        {
          number: '01',
          title: 'Material selection',
          body: 'We begin by choosing materials for performance, tactility and long-term durability.',
          bg_image: { url: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?q=80&w=1600&auto=format&fit=crop' }
        },
        {
          number: '02',
          title: 'Precision shaping',
          body: 'Each component is formed with controlled tolerances to preserve the intended geometry.',
          bg_image: { url: 'https://images.unsplash.com/photo-1581092335397-9583fe92d232?q=80&w=1600&auto=format&fit=crop' }
        },
        {
          number: '03',
          title: 'Surface refinement',
          body: 'Textures and finishes are developed to create depth, grip and a distinctive visual rhythm.',
          bg_image: { url: 'https://images.unsplash.com/photo-1504384308090-c894fdcc538d?q=80&w=1600&auto=format&fit=crop' }
        },
        {
          number: '04',
          title: 'System assembly',
          body: 'Individual parts are aligned and assembled into one coherent, high-performance structure.',
          bg_image: { url: 'https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=1600&auto=format&fit=crop' }
        },
        {
          number: '05',
          title: 'Final validation',
          body: 'The complete product is tested, adjusted and approved before it reaches its final form.',
          bg_image: { url: 'https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?q=80&w=1600&auto=format&fit=crop' }
        }
      ];

      if (counterTotal) {
        counterTotal.textContent = String(stages.length).padStart(2, '0');
      }

      // Populate background layers
      if (stageLayersWrap) {
        stageLayersWrap.innerHTML = '';
        stages.forEach((item, index) => {
          const bgDiv = document.createElement('div');
          bgDiv.className = 'dial-bg dial-bg--stage' + (index === 0 ? ' is-active' : '');
          bgDiv.dataset.index = index;
          if (item.bg_image && item.bg_image.url) {
            bgDiv.style.backgroundImage = `url("${item.bg_image.url}")`;
          }
          stageLayersWrap.appendChild(bgDiv);
        });
      }

      const CX = 500;
      const CY = 500;
      const R = 430;
      const ACTIVE_ANGLE = 0;
      const STAGE_START_ANGLE = -56;
      const STAGE_END_ANGLE = 56;

      const toRad = deg => deg * Math.PI / 180;
      const stageAngle = index => STAGE_START_ANGLE + (STAGE_END_ANGLE - STAGE_START_ANGLE) * (index / (stages.length - 1));

      function pointOnCircle(angle, radius = R) {
        const a = toRad(angle);
        return {
          x: CX + Math.cos(a) * radius,
          y: CY + Math.sin(a) * radius
        };
      }

      const stageLabels = [];

      function createStageLabels() {
        stages.forEach((item, index) => {
          const el = document.createElement('div');
          el.className = 'dial__label sc-dial_label_typography';
          el.textContent = item.number;
          el.dataset.index = index;
          labelsWrap.appendChild(el);
          stageLabels.push(el);
        });
      }

      function setElementOnCircle(el, angle, radius) {
        const point = pointOnCircle(angle, radius);
        el.style.left = `${point.x / 10}%`;
        el.style.top = `${point.y / 10}%`;
      }

      function updateDial(stagePosition) {
        const interpolatedSourceAngle = STAGE_START_ANGLE +
          (STAGE_END_ANGLE - STAGE_START_ANGLE) * (stagePosition / (stages.length - 1));
        const rotationOffset = ACTIVE_ANGLE - interpolatedSourceAngle;

        stageLabels.forEach((label, index) => {
          setElementOnCircle(label, stageAngle(index) + rotationOffset, R + 62);
        });
      }

      const fixedDot = pointOnCircle(ACTIVE_ANGLE, R);
      dot.setAttribute('cx', fixedDot.x);
      dot.setAttribute('cy', fixedDot.y);

      let activeIndex = -1;

      function updateActive(stagePosition) {
        const index = Math.max(0, Math.min(stages.length - 1, Math.round(stagePosition)));
        if (index === activeIndex) return;
        activeIndex = index;

        stageLabels.forEach((label, i) => {
          label.classList.toggle('is-active', i === index);
          gsap.to(label, {
            scale: i === index ? 1.22 : 1,
            opacity: i === index ? 1 : .46,
            duration: .25,
            overwrite: true
          });
        });

        // Crossfade stage background
        if (stageLayersWrap) {
          const stageBgs = stageLayersWrap.querySelectorAll('.dial-bg--stage');
          stageBgs.forEach((bg, i) => {
            bg.classList.toggle('is-active', i === index);
          });
        }

        const next = stages[index];
        const outgoing = [title, body, counterCurrent];

        gsap.to(outgoing, {
          y: -12,
          opacity: 0,
          duration: .16,
          stagger: .02,
          overwrite: true,
          onComplete: () => {
            title.textContent = next.title;
            body.textContent = next.body;
            counterCurrent.textContent = next.number;
            gsap.fromTo(outgoing,
              { y: 16, opacity: 0 },
              { y: 0, opacity: 1, duration: .28, stagger: .035, ease: 'power2.out', overwrite: true }
            );
          }
        });
      }

      createStageLabels();
      updateDial(0);
      updateActive(0);

      const state = { stagePosition: 0 };

      gsap.timeline({
        defaults: { ease: 'none' },
        scrollTrigger: {
          trigger: stage,
          start: 'top top',
          end: `+=${stages.length * 900}`,
          scrub: 0.55,
          pin: true,
          anticipatePin: 1,
          invalidateOnRefresh: true,
          snap: {
            snapTo: 1 / (stages.length - 1),
            duration: { min: 0.12, max: 0.35 },
            delay: 0.05,
            ease: 'power1.inOut'
          }
        }
      })
      .to(state, {
        stagePosition: stages.length - 1,
        duration: 1,
        onUpdate: () => {
          updateDial(state.stagePosition);
          updateActive(state.stagePosition);
        }
      }, 0);

      window.addEventListener('load', () => ScrollTrigger.refresh());
    })();
  </script>
</body>
</html>
