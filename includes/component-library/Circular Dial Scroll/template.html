<div class="dial-demo-wrapper" data-bg-mode="{{bg_mode}}">
  <section class="dial-stage">
    <div class="dial-bg-container">
      <div class="dial-bg dial-bg--fixed" style="{{#bg_image.url}}background-image: url('{{bg_image.url}}');{{/bg_image.url}}"></div>
      <div class="dial-bg-stage-layers">
        {{#stages}}
        <div class="dial-bg dial-bg--stage" data-number="{{number}}" style="{{#bg_image.url}}background-image: url('{{bg_image.url}}');{{/bg_image.url}}"></div>
        {{/stages}}
      </div>
      <div class="dial-bg-overlay"></div>
    </div>

    <div class="dial" aria-hidden="true">
      <svg class="dial__circle" viewBox="0 0 1000 1000">
        <circle class="dial__base" cx="500" cy="500" r="430"></circle>
        <circle class="dial__dot" cx="0" cy="0" r="5"></circle>
      </svg>

      <div class="dial__labels"></div>
    </div>

    <div class="dial-content">
      {{#show_eyebrow}}
      <p class="dial-content__eyebrow sc-eyebrow_typography">{{eyebrow_text}}</p>
      {{/show_eyebrow}}
      <h2 class="dial-content__title sc-title_typography"></h2>
      <p class="dial-content__body sc-body_typography"></p>
      {{#show_counter}}
      <div class="dial-content__counter sc-counter_typography">
        <span class="current">01</span><span class="separator">{{counter_separator}}</span><span class="total">05</span>
      </div>
      {{/show_counter}}
    </div>
  </section>
</div>
